[workspace]
resolver = "2"
members = ["app", "frontend", "server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
# Leptos stack (0.8.x is the latest stable line; 0.9 is still a release candidate)
leptos = "0.8.23"
leptos_meta = "0.8.7"
leptos_router = "0.8.17"
leptos_axum = "0.8.10"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1.7"

# Server
axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "signal", "time"] }
tower = "0.5.3"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "mysql", "chrono", "macros", "migrate"] }
tower-sessions = { version = "0.15.0", default-features = false, features = ["axum-core"] }
argon2 = "0.6.0"
# SMTP over rustls (webpki roots, ring); no native-tls/openssl.
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "pool", "hostname", "builder", "tokio1", "tokio1-rustls", "rustls-tls"] }
dotenvy = "0.15.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
time = "0.3"
async-trait = "0.1"

# Shared
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

app = { path = "app", default-features = false }

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[[workspace.metadata.leptos]]
name = "irgendwas"
bin-package = "server"
lib-package = "frontend"
site-root = "target/site"
site-pkg-dir = "pkg"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
end2end-cmd = "sh run.sh"
end2end-dir = "end2end"
browserquery = "defaults"
env = "DEV"
bin-features = []
bin-default-features = false
lib-features = []
lib-default-features = false
lib-profile-release = "wasm-release"
# Debug builds render the same HTML as release builds (erase_components adds `<!>` markers
# after dynamic text, so `cargo leptos test` would see different markup than production).
disable-erase-components = true
