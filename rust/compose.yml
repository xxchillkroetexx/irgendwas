# Production stack: Caddy (edge or behind another proxy) → app → MariaDB.
#
#   cp compose.env.example prod.env    # fill in secrets, APP_URL, mail, proxy settings
#   podman compose --env-file prod.env -f compose.yml up -d --build
#
# Always pass --env-file: without it compose reads ./.env, which is the *development* config.
# See README.md ("Production") for the edge and behind-a-proxy setups.
name: irgendwas-rust

services:
  caddy:
    image: docker.io/library/caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTP_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
      - "${HTTP_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443/udp"
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-:80}
      CADDY_AUTO_HTTPS: ${CADDY_AUTO_HTTPS:-off}
      # Only the proxies in front of Caddy (space-separated; empty = Caddy is the edge).
      # Never Caddy's own address: rootless podman forwards published ports so that clients
      # appear to come from it, and trusting it would let clients forge X-Forwarded-For.
      TRUSTED_PROXIES_CIDR: ${TRUSTED_PROXIES_CIDR:-}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge:
        ipv4_address: ${CADDY_IP:-172.31.250.10}

  app:
    image: ${APP_IMAGE:-localhost/irgendwas-rust:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      APP_URL: ${APP_URL:?set APP_URL (public URL, e.g. https://wichteln.example)}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_LOCALE: ${APP_LOCALE:-en}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Berlin}
      INACTIVITY_LIMIT: ${INACTIVITY_LIMIT:-1200}
      # Caddy's fixed edge address plus the proxies in front of Caddy.
      TRUSTED_PROXIES_CIDR: "${CADDY_IP:-172.31.250.10}/32 ${TRUSTED_PROXIES_CIDR:-}"
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-irgendwas_db}
      DB_USERNAME: ${DB_USERNAME:-irgendjemand}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      MAIL_HOST: ${MAIL_HOST:-smtp.example.com}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-ssl}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Secret Santa}
      RUST_LOG: ${RUST_LOG:-info}
    healthcheck:
      test: ["CMD", "/app/server", "--healthcheck"]
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - edge
      - database

  mariadb:
    image: docker.io/library/mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE:-irgendwas_db}
      MARIADB_USER: ${DB_USERNAME:-irgendjemand}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - database

networks:
  # Caddy ↔ app. Fixed subnet so Caddy has a known address the app can trust.
  edge:
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.31.250.0/24}
  # app ↔ MariaDB, not reachable from Caddy.
  database:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  mariadb_data:
