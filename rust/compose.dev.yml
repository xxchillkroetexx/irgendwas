# Local development and test services for the Rust rewrite.
#   podman compose -f compose.dev.yml up -d
# MariaDB runs in Europe/Berlin like production; the app connection pins UTC.
name: irgendwas-rust-dev

services:
  mariadb:
    image: docker.io/library/mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: devrootpassword
      MARIADB_DATABASE: irgendwas_db
      MARIADB_USER: irgendjemand
      MARIADB_PASSWORD: devpassword
      TZ: Europe/Berlin
    command: ["--default-time-zone=Europe/Berlin"]
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 10

  # Throwaway server for `#[sqlx::test]` (DATABASE_URL points here): every test creates a
  # database and runs all migrations, which on a disk-backed volume made the suite take
  # 8+ minutes (DDL creates/rebuilds files). Data lives in RAM and is lost on restart;
  # durability flags are off. Dev/test only — never copy these settings to compose.yml.
  mariadb-test:
    image: docker.io/library/mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: devrootpassword
      MARIADB_DATABASE: irgendwas_db
      TZ: Europe/Berlin
    command:
      - "--default-time-zone=Europe/Berlin"
      - "--innodb-flush-log-at-trx-commit=0"
      - "--innodb-doublewrite=0"
      - "--innodb-flush-method=nosync"
    ports:
      - "127.0.0.1:3308:3306"
    tmpfs:
      - /var/lib/mysql:rw,size=4g
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: docker.io/axllent/mailpit:latest
    ports:
      - "127.0.0.1:1026:1025"   # SMTP
      - "127.0.0.1:8026:8025"   # web UI / API
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

volumes:
  mariadb_data:
