[package]
name = "app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
chrono-tz.workspace = true

# server-only (enabled by the `ssr` feature)
leptos_axum = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
tower-sessions = { workspace = true, optional = true }
argon2 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
lettre = { workspace = true, optional = true }
dotenvy = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
ipnet = { version = "2", optional = true }
# test-support only: Mailpit API client (plain HTTP, no TLS stack)
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query"], optional = true }

# client-only
web-sys = { version = "0.3", optional = true, features = ["Document", "Element", "HtmlElement", "HtmlInputElement", "Location", "Window", "Navigator", "Clipboard"] }
wasm-bindgen-futures = { version = "0.4", optional = true }

[features]
default = []
hydrate = ["leptos/hydrate", "dep:web-sys", "dep:wasm-bindgen-futures"]
ssr = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "dep:leptos_axum",
    "dep:axum",
    "dep:tokio",
    "dep:sqlx",
    "dep:tower-sessions",
    "dep:argon2",
    "dep:sha2",
    "dep:getrandom",
    "dep:base64",
    "dep:lettre",
    "dep:dotenvy",
    "dep:tracing",
    "dep:ipnet",
]
# Fixtures for integration tests (`app::test_support`). Never enable in production builds.
test-support = ["ssr", "dep:reqwest"]
