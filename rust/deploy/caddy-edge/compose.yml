# Alternative setup: Caddy is the TLS edge (no proxy in front). Publishes HTTPS (+ HTTP/3):
#   podman compose --env-file prod.env -f compose.yml -f deploy/caddy-edge/compose.yml up -d
# with HTTP_BIND=0.0.0.0, HTTP_PORT=80, CADDY_SITE_ADDRESS=<domain>, CADDY_AUTO_HTTPS=on,
# TRUSTED_PROXIES_CIDR= (empty). See README "Alternative: Caddy is the edge" for the
# rootless-podman caveat (all clients share one address).
services:
  caddy:
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTPS_PORT:-443}:443"
      - "${HTTP_BIND:-127.0.0.1}:${HTTPS_PORT:-443}:443/udp"
