# Traefik dynamic configuration (file provider, reloaded on change).
# Caddy publishes plain HTTP on 127.0.0.1:${HTTP_PORT} (prod.env, default 8080); keep the
# port here in sync. Security headers (HSTS, nosniff, X-Frame-Options, Referrer-Policy)
# and compression come from Caddy, so there are no middlewares here.
http:
  routers:
    irgendwas:
      rule: Host(`wichteln.example`)
      entryPoints:
        - websecure
      service: irgendwas
      tls:
        certResolver: letsencrypt

  services:
    irgendwas:
      loadBalancer:
        # Caddy and the app see the public host name; the app's CSRF check compares the
        # Origin header (forwarded unchanged) with APP_URL.
        passHostHeader: true
        servers:
          - url: http://127.0.0.1:8080
