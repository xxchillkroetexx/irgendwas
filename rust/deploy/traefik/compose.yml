# Traefik on the host network in front of the irgendwas stack (../../compose.yml).
#   cd deploy/traefik && podman compose up -d
# Host network: Traefik sees the real client addresses and reaches Caddy on 127.0.0.1.
# Binding :80/:443 needs privileges; see README "Production" (rootless: lower
# net.ipv4.ip_unprivileged_port_start, or run this file with rootful podman).
name: traefik

services:
  traefik:
    image: docker.io/library/traefik:v3
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      # acme.json (certificates + account key); Traefik creates it with mode 600.
      - traefik_acme:/var/lib/traefik

volumes:
  traefik_acme:
