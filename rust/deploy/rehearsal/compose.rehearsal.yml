# Local release rehearsal only (scripts/rehearsal.sh), never in production: the app sends
# mail to the dev compose's Mailpit (its network, `mailpit:1025`) and allows the whole
# Playwright suite from one client address.
services:
  app:
    environment:
      RATE_LIMIT_MAIL_PER_IP: "1000"
    networks:
      - devmail

networks:
  devmail:
    external: true
    name: irgendwas-rust-dev_default
