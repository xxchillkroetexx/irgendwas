# nginx as the EDGE in front of Caddy (rehearsal setup B).
server {
    listen 80;
    server_tokens off;

    location / {
        proxy_pass http://caddy:80;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # Overwrite, don't append ($proxy_add_x_forwarded_for): under rootless podman every
        # client of a published port appears as nginx's own address, which Caddy and the
        # app trust, so they would take a client-supplied X-Forwarded-For entry as the client.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
