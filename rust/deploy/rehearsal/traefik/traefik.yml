# Rehearsal setup C (scripts/rehearsal.sh up c): deploy/traefik/traefik.yml on loopback
# high ports, with a local test certificate (/certs, generated by the script) instead of
# ACME. Keep the rest in sync with the production file.
global:
  checkNewVersion: false
  sendAnonymousUsage: false
  aliasHeadersStrategy: delete

log:
  level: INFO

accessLog:
  format: json

entryPoints:
  web:
    address: "127.0.0.1:18082"
    forwardedHeaders:
      insecure: false
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: "127.0.0.1:18443"
    forwardedHeaders:
      insecure: false
    http:
      tls: {}
      encodedCharacters:
        allowEncodedSlash: false
        allowEncodedBackslash: false
        allowEncodedNullCharacter: false

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true
