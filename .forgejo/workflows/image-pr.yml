# The release image for pull requests that can break it (#103): the same build and smoke
# test as the `image` job in ci.yml, without a push. Only for changes to what goes into
# the image beyond the code check and e2e already build: the Dockerfile and its context
# rules, dependencies and toolchain (release profile), static files (public/), migrations (applied
# at start) and these CI files. A release build takes ~25 minutes on the runner.
name: image-pr

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - "*/Cargo.toml"
      - "rust-toolchain.toml"
      - "public/**"
      - "migrations/**"
      - "server/src/main.rs"
      - "server/src/healthcheck.rs"
      - "scripts/install-cargo-leptos.sh"
      - "scripts/ci-image.sh"
      - ".forgejo/workflows/image-pr.yml"
      - ".forgejo/workflows/ci.yml"

env:
  IMAGE: git.scheissndreck.de/irgendwas/irgendwas

jobs:
  image:
    runs-on: docker
    container:
      # See the `image` job in ci.yml (seccomp, chroot isolation, vfs).
      image: quay.io/buildah/stable:latest
    services:
      mariadb:
        image: docker.io/library/mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ci-root-password
          MARIADB_DATABASE: irgendwas_db
          MARIADB_USER: irgendjemand
          MARIADB_PASSWORD: ci-password
        options: >-
          --tmpfs /var/lib/mysql:rw,size=1g
    env:
      BUILDAH_ISOLATION: chroot
      STORAGE_DRIVER: vfs
      BUILDAH_FORMAT: docker
    steps:
      - name: Install git, node (needed by checkout) and curl
        run: dnf install -y --setopt=install_weak_deps=False git nodejs curl
      - uses: actions/checkout@v4
      - name: Build
        run: sh scripts/ci-image.sh build
      - name: Smoke test
        run: sh scripts/ci-image.sh smoke
      - name: Free the runner's disk
        if: always()
        run: buildah rm --all >/dev/null 2>&1 || true; buildah rmi --all --force >/dev/null 2>&1 || true
