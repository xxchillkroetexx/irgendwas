# CI for the Rust/Leptos rewrite in rust/.
# `runs-on: docker` must match a label of your Forgejo runner (container jobs).
#
# A runner may allow the named volume `irgendwas-ci-target` to reuse build output.
# Rootless engines create it in their own storage, without a privileged host directory.
# If the runner's volume allowlist rejects it, ci-target-dir.sh falls back to a normal
# checkout-local target directory. CI must work without cache provisioning.
name: rust

on:
  push:
    paths:
      - "rust/**"
      - "docs/deployment.md"
      - ".forgejo/workflows/rust.yml"
  pull_request:
    paths:
      - "rust/**"
      - "docs/deployment.md"
      - ".forgejo/workflows/rust.yml"

env:
  CARGO_LEPTOS_VERSION: "0.3.11"
  CARGO_TERM_COLOR: always
  # Keep the runner's disk usage down: no debuginfo, no incremental cache in CI.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  TARGET_CACHE_MAX_MB: "20000"
  IMAGE: git.scheissndreck.de/irgendwas/irgendwas
  # Test services (job containers reach services by their name).
  DATABASE_URL: mysql://root:ci-root-password@mariadb:3306/irgendwas_db
  MAILPIT_URL: http://mailpit:8025
  MAILPIT_SMTP_HOST: mailpit
  MAILPIT_SMTP_PORT: "1025"

jobs:
  deployment-config:
    runs-on: docker
    container:
      image: docker.io/library/docker:28-cli
    steps:
      - name: Install checkout and validation tools
        run: apk add --no-cache git nodejs python3
      - uses: actions/checkout@v4
      - name: Validate deployment configuration and required secrets
        working-directory: rust
        run: sh scripts/check-deployment.sh

  check:
    runs-on: docker
    container:
      image: docker.io/library/rust:1.99.1-slim-trixie
      volumes:
        - irgendwas-ci-target:/ci-cache
    services:
      mariadb:
        image: docker.io/library/mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ci-root-password
          MARIADB_DATABASE: irgendwas_db
          MARIADB_USER: irgendjemand
          MARIADB_PASSWORD: ci-password
        # Every #[sqlx::test] creates a database and runs all migrations; on disk this is
        # ~50x slower. RAM-backed, durability off (throwaway CI database).
        options: >-
          --tmpfs /var/lib/mysql:rw,size=4g
        cmd: ["--innodb-flush-log-at-trx-commit=0", "--innodb-doublewrite=0", "--innodb-flush-method=nosync"]
      mailpit:
        image: docker.io/axllent/mailpit:latest
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - name: Install git and node (needed by checkout)
        working-directory: /
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git nodejs
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml) and cargo-leptos
        run: |
          rustup toolchain install
          sh scripts/install-cargo-leptos.sh
      - name: Persistent target dir
        run: sh scripts/ci-target-dir.sh /ci-cache/target-check
      - name: Configuration
        run: cp .env.example .env
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 60); do
            (echo > /dev/tcp/mariadb/3306) 2>/dev/null && exit 0
            sleep 2
          done
          echo "MariaDB did not come up" >&2
          exit 1
      - name: Tests
        run: cargo leptos test

  e2e:
    runs-on: docker
    container:
      # run.sh detects this image (PLAYWRIGHT_BROWSERS_PATH) and runs Playwright directly.
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      volumes:
        - irgendwas-ci-target:/ci-cache
    services:
      mariadb:
        image: docker.io/library/mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ci-root-password
          MARIADB_DATABASE: irgendwas_db
          MARIADB_USER: irgendjemand
          MARIADB_PASSWORD: ci-password
      mailpit:
        image: docker.io/axllent/mailpit:latest
    env:
      # Server configuration; real env vars override rust/.env.
      APP_URL: http://localhost:3000
      BASE_URL: http://localhost:3000
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_USERNAME: irgendjemand
      DB_PASSWORD: ci-password
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_ENCRYPTION: none
      # The whole suite registers from one IP; production keeps the default of 20.
      RATE_LIMIT_MAIL_PER_IP: "1000"
      CI: "true"
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - name: Install build tools and rustup
        working-directory: /
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml) and cargo-leptos
        run: |
          rustup toolchain install
          sh scripts/install-cargo-leptos.sh
      - name: Persistent target dir
        run: sh scripts/ci-target-dir.sh /ci-cache/target-e2e
      - name: Configuration
        run: cp .env.example .env
      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 60); do
            (echo > /dev/tcp/mariadb/3306) 2>/dev/null && exit 0
            sleep 2
          done
          echo "MariaDB did not come up" >&2
          exit 1
      - name: End-to-end tests
        run: cargo leptos end-to-end
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report
          path: rust/end2end/playwright-report/

  # Image → Forgejo container registry, for pushes to dev (tag :dev) and main (tag
  # :latest), after check and e2e passed; both also get :sha-<12 chars> of the commit.
  # Rootless buildah (chroot isolation, vfs storage) needs neither the host's Docker
  # socket nor privileged containers. Repo secrets: REGISTRY_USER and
  # REGISTRY_TOKEN (an access token with package write scope).
  image:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    needs: [check, e2e, deployment-config]
    runs-on: docker
    container:
      image: quay.io/buildah/stable:latest
    env:
      BUILDAH_ISOLATION: chroot
      STORAGE_DRIVER: vfs
      BUILDAH_FORMAT: docker
    steps:
      - name: Install git and node (needed by checkout)
        run: dnf install -y --setopt=install_weak_deps=False git nodejs
      - uses: actions/checkout@v4
      - name: Build
        working-directory: rust
        run: |
          short="${GITHUB_SHA::12}"
          case "$GITHUB_REF" in
            refs/heads/main) channel=latest ;;
            refs/heads/dev) channel=dev ;;
            *) echo "no image tag for $GITHUB_REF" >&2; exit 1 ;;
          esac
          echo "SHORT_SHA=$short" >> "$GITHUB_ENV"
          echo "CHANNEL=$channel" >> "$GITHUB_ENV"
          # --format docker keeps the HEALTHCHECK; the build runs `cargo leptos build --release`.
          buildah build \
            --format docker \
            --layers=false \
            --build-arg CARGO_BUILD_JOBS=4 \
            --label org.opencontainers.image.source=https://git.scheissndreck.de/irgendwas/irgendwas \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            -t "${IMAGE}:sha-${short}" \
            -t "${IMAGE}:${channel}" \
            -f Dockerfile .
      - name: Push
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | buildah login -u "$REGISTRY_USER" --password-stdin git.scheissndreck.de
          buildah push "${IMAGE}:sha-${SHORT_SHA}"
          buildah push "${IMAGE}:${CHANNEL}"
          buildah logout git.scheissndreck.de
      - name: Free the runner's disk
        if: always()
        run: buildah rm --all >/dev/null 2>&1 || true; buildah rmi --all --force >/dev/null 2>&1 || true
